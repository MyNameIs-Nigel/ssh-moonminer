# Local durability drill stack: ssh-moonminer wired to a MinIO container
# instead of real S3, using the same Dockerfile/entrypoint the fleet runs in
# production (litestream and the `mc` host-key sync don't care that the
# endpoint is MinIO — that's the whole point of using an S3-compatible API).
#
# The one thing this stack deliberately cannot cover: production leaves the
# LITESTREAM_ACCESS_KEY_ID/SECRET vars unset so litestream picks up the EC2
# instance role, while this sets them explicitly. A broken IAM policy passes
# every drill here. See ../../../ssh-arcadelobby/docs/06-fleet-data-durability.md.
#
# Usage: see run.sh in this directory.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data
    environment:
      MINIO_ROOT_USER: drilluser
      MINIO_ROOT_PASSWORD: drillpassword
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set drill http://minio:9000 drilluser drillpassword &&
      mc mb -p drill/ssharcade-drill
      "

  moonminer:
    build:
      context: ../..
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      MOONMINER_LOG_FORMAT: text
      MOONMINER_LOG_LEVEL: debug
      LITESTREAM_REPLICA_URL: s3://ssharcade-drill/moonminer/db
      LITESTREAM_S3_REGION: us-east-1
      LITESTREAM_S3_ENDPOINT: http://minio:9000
      LITESTREAM_ACCESS_KEY_ID: drilluser
      LITESTREAM_SECRET_ACCESS_KEY: drillpassword
      # litestream 0.5+ auto-detects a host:port endpoint as MinIO and
      # enables path-style addressing; no force-path-style flag needed.
      # No host-key vars here any more: the entrypoint seeds its host key from a
      # read-only host mount, not from the bucket, so MOONMINER_HOST_KEY_MC_PATH and
      # MC_HOST_drill would be silently ignored. The drill exercises the DB
      # restore path, which is what its gate actually asserts; the container
      # generates a throwaway host key, which is correct for a drill.
    volumes:
      - moonminer-drill-data:/var/lib/moonminer
    ports:
      - "2224:2222" # 2224, not farm's 2222: both drills can run side by side

volumes:
  moonminer-drill-data:
