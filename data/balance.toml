[pilot]
start_credits = 1000
start_fuel = 100
start_hull = 100

[belt]
asteroids_per_belt = 7
volume_min = 240
volume_max = 4600
volume_step = 20
drill_sec_min = 10.0
drill_sec_max = 45.0
drill_sec_per_volume = 100
value_per_volume = 1.15
value_step = 25
distance_min = 0.2
distance_max = 10.0
scan_fuel_cost = 2.0
scan_sec_per_km = 0.5
risk_min = 8
risk_max = 96
risk_base = 18
risk_per_tier = 16
name_prefixes = ["AX", "KR", "VL", "ND", "TH", "ZE", "QU", "RX", "OB", "MX"]

[tiers]
labels = ["COMMON", "UNCOMMON", "RARE", "LEGENDARY"]
glyphs = ["◇", "◆", "✦", "★"]
mults = [1.0, 2.3, 4.6, 9.5]

[mining]
# There is no overdrive in this design. Mining tension comes from time,
# radar, cargo load, events, and escape risk (docs/gameplay/02).
tick_hz = 4
pirate_approach_base = 7.0
pirate_approach_per_tier = 3.0
fuel_drain_base = 1.3
fuel_drain_per_tier = 0.35

tribute_chance = 0.55
tribute_demand_pct = 0.45
tribute_decision_seconds = 12.0

base_escape_seconds = 4.0
escape_cargo_exponent = 1.6
cargo_escape_penalty_seconds = 10.0
escape_fuel_drain_per_sec = 0.15
fuel_out_escape_penalty_per_sec = 0.6
fuel_out_escape_penalty_cap_seconds = 6.0
attack_hull_damage_per_second = 6.0

remnant_keep_threshold = 0.2

# Each run exposes one to three pressure points. A hit fractures 18% of the
# ore still in the rock; a miss permanently spoils just that point.
skill_check_min_interval_seconds = 5.0
skill_check_max_interval_seconds = 9.0
skill_check_window_seconds = 3.0
pressure_points_min = 1
pressure_points_max = 3
skill_check_bonus_pct = 0.18

# Rolled independently of distance and rarity. Fuel veins are hidden unless a
# Fuel Miner is installed.
fuel_asteroid_chance = 0.33

# Fuzzed pirate ETA range shown on the mining-screen radar.
eta_base_uncertainty_pct = 0.5
eta_surveyor_reduction_pct = 0.08
eta_min_uncertainty_pct = 0.15

[combat]
# Tactical-scope pirate combat — docs/gameplay/07-pirate-combat-and-bounties.md.
# Bearing/Range are a deterministic sum-of-sines function of run.TickCount
# (scaled by the pirate's roster maneuver stat) so replay stays exact; no
# per-tick RNG in the maneuver path.
heat_capacity = 100.0
heat_decay_per_second = 18.0
overheat_lock_seconds = 4.0
arc_center = 0.5
arc_half_width = 0.18
solution_range_floor = 0.35
range_min = 0.35
maneuver_w1 = 0.11
maneuver_w2 = 0.043
maneuver_w3 = 0.07
maneuver_amp1 = 0.30
maneuver_amp2 = 0.18
odds_avg_solution_base = 0.55
odds_floor = 0.02
odds_ceiling = 0.98

[events]
base_chance_per_minute = 6.0
low_hull_chance_bonus = 18.0
base_bad_weight = 0.6
low_hull_bad_weight = 1.6
cooldown_seconds = 12.0

power_outage_seconds = 4.0
radar_blackout_seconds = 6.0
life_support_countdown_seconds = 10.0
life_support_bleed_per_second = 3
cargo_shift_effect_seconds = 4.0
cargo_shift_escape_pct = 0.25
reactor_surge_seconds = 5.0
reactor_surge_fuel_mul = 2.2
reactor_surge_hull_hit_chance = 0.2
reactor_surge_hull_hit_amount = 8

[port]
refuel_per_point = 9
repair_per_point = 14
drydock_surcharge_mul = 1.5
insurance_credits = 300
insurance_fuel_threshold = 6
insurance_credit_threshold = 50

[fleet]
# Ship-track (Thrusters/Hull/Fuel Eff/Power Gen/Scanner) grade economy, the
# power/mass system, Scanner distance lock, distance-biased rarity, the
# event hull gate, and ship buyback. See
# docs/gameplay/05-fleet-ships-and-shipyard-economy.md — grade is 0..5 (E..S).
grade_price_curve = 2.2
thrusters_base_price = 500
hull_base_price = 450
fuel_eff_base_price = 550
power_gen_base_price = 650
scanner_base_price = 700
# Every grade is 12% faster before mass effects (S = ~53% base escape time).
thruster_escape_mul = 0.88
fuel_eff_mul = 0.92
hull_pool_per_grade = 20
power_capacity_base = 10
power_capacity_per_grade = 8
power_curve_exponent = 1.5
scanner_lock_base_km = 4.0
scanner_lock_per_grade_km = 2.0
scanner_lock_max_km = 10.0
scanner_scan_mul = 0.80
scanner_instant_scan_km = 2.0
scanner_eta_bonus_pct = 0.05
mass_fuel_coefficient = 0.5
mass_escape_coefficient = 0.6
distance_rarity_bonus_max = 0.08
event_hull_gate_pct = 0.20
buyback_price_pct = 0.25

[slots]
# Utility/Weapon/Internal slot device catalog. Price = base * fleet's
# grade_price_curve^grade. Cargo/Fuel Tank have no power_k — they never draw
# power (the one explicit exception to "every slot costs power").
# sell_value_pct is the shipyard's remove-and-sell refund: fraction of the
# device's current buy price paid back in credits (the "store" alternative
# refunds nothing but keeps the device, re-equippable for free later).
sell_value_pct = 0.95
cargo_base_price = 300
cargo_per_grade = 600
cargo_mass_per_grade = 6
fuel_tank_base_price = 350
fuel_tank_per_grade = 10
fuel_tank_mass_per_grade = 5
shield_base_price = 900
shield_power_k = 2.0
  shield_mass_per_grade = 8
  # Combat rework: the turret's passive damage mitigation is retired in favor
  # of an active weapon, so the shield is now the sole mitigation layer — the
  # per-grade pool is buffed accordingly (was 20).
  shield_hp_per_grade = 30
  # E shields recharge from empty in 90 seconds; S shields in 15 seconds.
  # A shield that bursts in a run can recover only 25% in the belt until it
  # returns to dock for a full service.
  shield_recharge_e_seconds = 90
  shield_recharge_s_seconds = 15
shield_burst_return_pct = 0.25
# Seismic Overcharge has mass-driver-class power draw (2/6/11/18/25/36) and
# high mass, in exchange for 45–120% faster drilling by grade E–S.
seismic_overcharge_base_price = 1300
seismic_overcharge_power_k = 2.2
seismic_overcharge_mass_per_grade = 9
seismic_overcharge_speed_e = 1.45
seismic_overcharge_speed_per_grade = 0.15
emp_launcher_base_price = 250
emp_launcher_power_k = 0.6
emp_launcher_mass_per_grade = 2
emp_launcher_deploy_e_seconds = 1
emp_launcher_deploy_s_seconds = 10
# Weapon catalog — the autocannon fires continuously; guided missiles and
# pulse lasers have distinct G/F controls so a Warden can fit both.
turret_base_price = 700
turret_power_k = 2.0
turret_mass_per_grade = 7
turret_damage_per_shot_base = 8.0
turret_damage_per_shot_per_grade = 3.0
# The autocannon's damage is deterministic: no solution roll or heat cost.
turret_shots_per_second = 0.82
missile_launcher_base_price = 1100
missile_launcher_power_k = 2.2
missile_launcher_mass_per_grade = 10
missile_damage_per_shot_base = 60.0
missile_damage_per_shot_per_grade = 20.0
# E through S. Every fitted launcher carries its own magazine, refilled at
# dock; missile shots always hit and have their own two-second cooldown.
missile_capacity_by_grade = [3, 4, 6, 7, 9, 10]
missile_cooldown_seconds = 2.0
pulse_laser_base_price = 900
pulse_laser_power_k = 1.8
pulse_laser_mass_per_grade = 5
pulse_laser_damage_per_shot_base = 5.0
pulse_laser_damage_per_shot_per_grade = 2.0
pulse_laser_heat_per_shot = 12.0
pulse_laser_solution_bonus = 0.10
internal_power_k = 1.0
internal_mass_per_grade = 4
seismic_base_price = 600
seismic_scan_count = 3
fuel_miner_base_price = 750
# On a fuel vein, E recovers exactly the fuel used by the drill. Each grade
# above E turns 25% of that burn into net fuel, subject to tank capacity.
fuel_miner_e_recovery_mul = 1.0
fuel_miner_per_grade_gain_mul = 0.25
jammer_base_price = 850
# uses_per_trip = 1 + grade/step: step=2 gives the first bonus charge at
# grade C (2), matching docs/gameplay/05's "grade C+ grants an extra use".
jammer_grade_uses_step = 2
# Each charge suppresses the pirate approach for this many seconds, E through
# S. The ordinary fuzzed ETA begins only after the jammer expires.
jammer_duration_seconds = [3.0, 5.0, 8.0, 12.0, 15.0, 25.0]
heat_sink_base_price = 1000
# Adds 25/50/75/100/125/150 to the shared 100-point combat heat capacitor.
heat_sink_capacity_per_grade = 25.0
legacy_drive_base_price = 25000

