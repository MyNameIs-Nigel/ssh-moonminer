glyphs = ["◇", "◆", "✦", "★"]
mults = [1.0, 2.3, 4.6, 9.5]

[mining]
# There is no overdrive in this design. Mining tension comes from time,
# radar, cargo load, events, and escape risk (docs/gameplay/02).
tick_hz = 4
pirate_approach_base = 7.0
pirate_approach_per_tier = 3.0
fuel_drain_base = 1.3
fuel_drain_per_tier = 0.35

tribute_chance = 0.55
tribute_demand_pct = 0.45
tribute_decision_seconds = 12.0

base_escape_seconds = 4.0
escape_cargo_exponent = 1.6
cargo_escape_penalty_seconds = 10.0
escape_fuel_drain_per_sec = 0.15
fuel_out_escape_penalty_per_sec = 0.6
fuel_out_escape_penalty_cap_seconds = 6.0
attack_hull_damage_per_second = 6.0

remnant_keep_threshold = 0.2

# Skill-check "drill calibration" minigame during mining: a countdown
# appears, press the hotkey before it hits zero. No moving target to track.
skill_check_min_interval_seconds = 5.0
skill_check_max_interval_seconds = 9.0
skill_check_window_seconds = 3.0
skill_check_bonus_pct = 0.12

# Fuzzed pirate ETA range shown on the mining-screen radar.
eta_base_uncertainty_pct = 0.5
eta_surveyor_reduction_pct = 0.08
eta_min_uncertainty_pct = 0.15

[events]
base_chance_per_minute = 6.0
low_hull_chance_bonus = 18.0
base_bad_weight = 0.6
low_hull_bad_weight = 1.6
cooldown_seconds = 12.0

power_outage_seconds = 4.0
radar_blackout_seconds = 6.0
life_support_countdown_seconds = 10.0
life_support_bleed_per_second = 3
cargo_shift_effect_seconds = 4.0
cargo_shift_escape_pct = 0.25
reactor_surge_seconds = 5.0
reactor_surge_fuel_mul = 2.2
reactor_surge_hull_hit_chance = 0.2
reactor_surge_hull_hit_amount = 8

[port]
refuel_per_point = 9
repair_per_point = 14
drydock_surcharge_mul = 1.5
insurance_credits = 300
insurance_fuel_threshold = 6
insurance_credit_threshold = 50

[fleet]
# Ship-track (Thrusters/Hull/Fuel Eff/Power Gen/Scanner) grade economy, the
# power/mass system, Scanner distance lock, distance-biased rarity, the
# event hull gate, and ship buyback. See
# docs/gameplay/05-fleet-ships-and-shipyard-economy.md — grade is 0..5 (E..S).
grade_price_curve = 2.2
thrusters_base_price = 500
hull_base_price = 450
fuel_eff_base_price = 550
power_gen_base_price = 650
scanner_base_price = 700
thruster_escape_mul = 0.94
fuel_eff_mul = 0.92
hull_pool_per_grade = 20
power_capacity_base = 10
power_capacity_per_grade = 8
power_curve_exponent = 1.5
scanner_lock_base_km = 4.0
scanner_lock_per_grade_km = 2.0
scanner_lock_max_km = 10.0
scanner_eta_bonus_pct = 0.05
mass_fuel_coefficient = 0.5
mass_escape_coefficient = 0.6
distance_rarity_bonus_max = 0.08
event_hull_gate_pct = 0.20
buyback_price_pct = 0.25

[slots]
# Utility/Weapon/Internal slot device catalog. Price = base * fleet's
# grade_price_curve^grade. Cargo/Fuel Tank have no power_k — they never draw
# power (the one explicit exception to "every slot costs power").
# sell_value_pct is the shipyard's remove-and-sell refund: fraction of the
# device's current buy price paid back in credits (the "store" alternative
# refunds nothing but keeps the device, re-equippable for free later).
sell_value_pct = 0.95
cargo_base_price = 300
cargo_per_grade = 600
cargo_mass_per_grade = 6
fuel_tank_base_price = 350
fuel_tank_per_grade = 10
fuel_tank_mass_per_grade = 5
shield_base_price = 900
shield_power_k = 2.7
  shield_mass_per_grade = 8
  shield_hp_per_grade = 20
  # E shields recharge from empty in 90 seconds; S shields in 15 seconds.
  # A shield that bursts in a run can recover only 25% in the belt until it
  # returns to dock for a full service.
  shield_recharge_e_seconds = 90
  shield_recharge_s_seconds = 15
  shield_burst_return_pct = 0.25
emp_launcher_base_price = 250
emp_launcher_power_k = 0.6
emp_launcher_mass_per_grade = 2
emp_launcher_deploy_e_seconds = 1
emp_launcher_deploy_s_seconds = 10
turret_base_price = 700
turret_power_k = 1.6
turret_mass_per_grade = 7
turret_pct_per_grade = 0.08
internal_power_k = 1.0
internal_mass_per_grade = 4
seismic_base_price = 600
seismic_scan_count = 3
fuel_miner_base_price = 750
fuel_miner_base_pct = 0.25
fuel_miner_per_grade_pct = 0.15
jammer_base_price = 850
# uses_per_trip = 1 + grade/step: step=2 gives the first bonus charge at
# grade C (2), matching docs/gameplay/05's "grade C+ grants an extra use".
jammer_grade_uses_step = 2
jump_drive_base_price = 25000

