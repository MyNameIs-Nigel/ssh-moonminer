version: 2

# One weekly group across ecosystems, the same shape as ssh-arcadelobby, so
# a Monday brings one PR per repo instead of a pile. Actions stay pinned by
# SHA; Dependabot updates the SHA and its version comment together.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
