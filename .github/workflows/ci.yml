name: CI

# pull_request (never pull_request_target): a fork PR gets a read-only token
# and no secrets, so running it is safe. It also tests the merge result, which
# is what actually ships. This replaces the old `push: branches: ["**"]`
# trigger, which never ran on a PR and gave every branch push the default token.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml

  gate:
    # One stable check name for branch protection, however the jobs above change.
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [verify]
    if: ${{ always() }}
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
